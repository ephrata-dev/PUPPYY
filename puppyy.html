<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppy Lovers Page</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        background:#e6e6e6;
    }

    /* Header */
    .header{
        background:#165a7a;
        color:white;
        text-align:center;
        padding:25px;
        font-size:32px;
        font-weight:bold;
    }

    /* Hero Image */
    .hero img{
        width:100%;
        height:450px;
        object-fit:cover;
        display:block;
    }

    /* First Row */
    .gallery{
        width:80%;
        margin:60px auto;
        display:flex;
        justify-content:center;
        gap:20px;
    }

    .gallery img,
    .missing{
        width:250px;
        height:250px;
    }

    .gallery img{
        object-fit:cover;
    }

    .missing{
        background:#ef4b68;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        font-size:30px;
        line-height:1.5;
        color:#222;
    }

    /* Section Title */
    .title{
        text-align:center;
        font-size:40px;
        font-weight:bold;
        margin-bottom:50px;
        color:#333;
    }

    /* Second Row */
    .more-puppies{
        width:80%;
        margin:0 auto 80px;
        display:flex;
        justify-content:center;
        gap:60px;
    }

    .more-puppies img{
        width:360px;
        height:500px;
        object-fit:cover;
    }

    /* Footer */
    .footer{
        background:#165a7a;
        color:white;
        text-align:center;
        padding:50px;
        font-size:28px;
        font-weight:bold;
    }
</style>
</head>

<body>

    <div class="header">
        Puppy lovers page
    </div>

    <div class="hero">
        <img src="C:/Users/one/Downloads/Telegram Desktop/Puupy lovers/Puupy lovers/banner-puppies.jpg" alt="Three puppies in basket">
    </div>

    <div class="gallery">
        <img src="C:/Users/one/Downloads/Telegram Desktop/Puupy lovers/Puupy lovers/puppy-1.jpg" alt="Puppy 1">

        <div class="missing">
            Puppy<br>
            missing<br>
            here!!
        </div>

        <img src="C:/Users/one/Downloads/Telegram Desktop/Puupy lovers/Puupy lovers/puppy-2.jpg" alt="Puppy 2">
    </div>

    <div class="title">
        More Puppies
    </div>

    <div class="more-puppies">
        <img src="C:/Users/one/Downloads/Telegram Desktop/Puupy lovers/Puupy lovers/puppy-3.jpg" alt="Puppy 3">
        <img src="C:/Users/one/Downloads/Telegram Desktop/Puupy lovers/Puupy lovers/puppy-4.jpg" alt="Puppy 4">
    </div>

    <div class="footer">
        Developed by:Ephrata Jenberu

</body>
</html>
